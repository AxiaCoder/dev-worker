# A fictional instance of the worker, checked against the WORKER.md header of this repository.
# Copy it outside the repository and replace every value with your own.

tracker:
  type: jira
  # The Jira site address and the email of the account the token belongs to.
  site: example.atlassian.net
  user: worker@example.com
  project: DEMO
  # The name of the environment variable that holds the token, never the token itself.
  token_env: JIRA_TOKEN
  # Optional. The fields a ticket must fill before a run takes it: each Jira field id,
  # customfield_ followed by digits or a lowercase system field name, mapped to the name the
  # worker shows for it. A ticket that leaves one empty is commented on and moved to blocked;
  # the agent gets the filled ones after the description, in this order.
  required_fields:
    customfield_10042: Acceptance criteria
    environment: Environment

repository:
  type: github
  name: example-org/example-app
  # Two tokens, each in its own variable. The agent's goes to the container: it can push
  # branches and open pull requests, but cannot update the base branch. The worker's stays
  # with the worker, which merges with it.
  agent_token_env: GITHUB_AGENT_TOKEN
  worker_token_env: GITHUB_WORKER_TOKEN

# The AI agent a run starts in its container: how it signs in, and the name of the environment
# variable that holds its credential, never the credential itself.
# provider: subscription for a Claude Code OAuth token, api_key for an Anthropic API key.
agent:
  provider: subscription
  token_env: CLAUDE_CODE_OAUTH_TOKEN
  # The model of the agent and of the guard review, passed to Claude Code by --model; an
  # alias like opus follows the latest version of its family.
  model: opus
  review_model: opus

# The name of the branch a run works on; {key} is replaced by the ticket key.
branch: agent/{key}

# The image a run starts, pinned by a tag other than latest or by a digest.
container:
  image: ghcr.io/example-org/example-app-agent:1.0.0

# The identity of the commits the worker's code makes. Use the account's noreply address,
# so that a push is not refused for exposing a private email.
git:
  name: Example Worker
  email: 12345678+example-worker@users.noreply.github.com

# Every status key of the header, mapped to the status name your tracker really uses.
statuses:
  ready: To Do
  in_progress: In Progress
  in_review: In Review
  blocked: Blocked
  done: Done

# The ticket label that holds a merge back: with it, the pull request stays open.
hold_merge_label: hold-merge

# Optional. Each limit may only tighten the header ceiling of the same name; review_max_turns
# caps the turns of the guard review a pull request gets before its merge, review_timeout_seconds
# the seconds of the run kept for that review, and max_attempts the runs that may die on a ticket
# before the worker blocks it. usage_limit_wait_seconds is how long the worker takes no ticket
# after a run reaches the usage limit of the agent's account without saying when it resets.
# run_timeout_seconds must exceed review_timeout_seconds by more than the 180 seconds kept for
# the agent to wait for the CI.
limits:
  max_turns: 40
