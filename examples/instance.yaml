# A fictional instance of the worker, checked against the WORKER.md header of this repository.
# Copy it outside the repository and replace every value with your own.

tracker:
  type: jira
  # The Jira site address and the email of the account the token belongs to.
  site: example.atlassian.net
  user: worker@example.com
  project: DEMO
  # The name of the environment variable that holds the token, never the token itself.
  token_env: JIRA_TOKEN

repository:
  type: github
  name: example-org/example-app
  token_env: GITHUB_TOKEN

# The name of the branch a run works on; {key} is replaced by the ticket key.
branch: agent/{key}

# The image a run starts, pinned by a tag other than latest or by a digest.
container:
  image: ghcr.io/example-org/example-app-agent:1.0.0

# The identity of the commits the worker's code makes. Use the account's noreply address,
# so that a push is not refused for exposing a private email.
git:
  name: Example Worker
  email: 12345678+example-worker@users.noreply.github.com

# Every status key of the header, mapped to the status name your tracker really uses.
statuses:
  ready: To Do
  in_progress: In Progress
  in_review: In Review
  blocked: Blocked
  done: Done

# The ticket label that holds a merge back: with it, the pull request stays open.
hold_merge_label: hold-merge

# Optional. Each limit may only tighten the header ceiling of the same name.
limits:
  max_turns: 40
