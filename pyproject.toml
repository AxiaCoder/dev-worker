[project]
name = "dev-worker"
version = "0.1.0"
description = "A worker that takes a framed ticket to a pull request, and merges it when nothing holds it back."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Benoît G", email = "18719082+AxiaCoder@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.coverage.run]
source_pkgs = ["dev_worker"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true

[dependency-groups]
dev = [
    "poethepoet>=0.49.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.poe.tasks.check]
help = "Lint, format check, types, and tests with the coverage floor"
sequence = [
    "ruff check",
    "ruff format --check",
    "pyright",
    "pytest --cov",
]
default_item_type = "cmd"
ignore_fail = "return_non_zero"
